name: github_downloader
description: Ứng dụng duyệt và tải file từ GitHub repo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_web_auth_2: ^5.0.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  archive: ^3.6.1
  url_launcher: ^6.3.0
  audioplayers: ^6.0.0
  file_picker: ^10.3.10
  flutter_foreground_task: ^10.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
