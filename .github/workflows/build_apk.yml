name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Tạo scaffold Android (nếu chưa có sẵn trong repo)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.tuytam --project-name github_downloader /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Ghi đè MainActivity.kt bằng bản tuỳ chỉnh (xử lý lưu file vào Downloads)
        run: |
          mkdir -p android/app/src/main/kotlin/com/tuytam/github_downloader
          cp android_custom/MainActivity.kt android/app/src/main/kotlin/com/tuytam/github_downloader/MainActivity.kt

      - name: Thêm CallbackActivity cho OAuth vào AndroidManifest.xml
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          activity_xml = '''        <activity android:name="com.linusu.flutter_web_auth_2.CallbackActivity" android:exported="true" android:taskAffinity="">
                  <intent-filter android:label="flutter_web_auth_2">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="githubdownloader" />
                  </intent-filter>
              </activity>
          '''

          content = content.replace("</application>", activity_xml + "    </application>")

          # Thêm quyền INTERNET (Flutter mặc định chỉ thêm cho bản debug, release cần khai báo tay)
          if 'android.permission.INTERNET' not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )

          # Thêm quyền ghi file cho Android cũ (dưới Android 10) - từ Android 10 trở lên
          # MediaStore.Downloads không cần quyền đặc biệt nào cả.
          if 'WRITE_EXTERNAL_STORAGE' not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application',
                  1,
              )

          # Thêm quyền cho tính năng khoá vân tay/khuôn mặt (local_auth)
          if 'USE_BIOMETRIC' not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application',
                  1,
              )

          # Thêm taskAffinity="" cho MainActivity để tránh lỗi quay vòng khi redirect từ trình duyệt
          if 'android:name=".MainActivity"' in content and 'taskAffinity' not in content.split('android:name=".MainActivity"')[1].split('>')[0]:
              content = content.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:taskAffinity=""',
              )

          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Cập nhật phiên bản Kotlin (nếu cần, hỗ trợ cả 2 định dạng)
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          elif [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.24"/' android/settings.gradle.kts
          fi

      - name: Cài dependencies
        run: flutter pub get

      - name: Tạo icon app từ ảnh gốc
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: github-downloader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
