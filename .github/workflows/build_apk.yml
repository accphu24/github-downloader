name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Tạo scaffold Android (nếu chưa có sẵn trong repo)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.tuytam --project-name github_downloader /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Ghi đè MainActivity.kt bằng bản tuỳ chỉnh (xử lý lưu file vào Downloads)
        run: |
          mkdir -p android/app/src/main/kotlin/com/tuytam/github_downloader
          cp android_custom/MainActivity.kt android/app/src/main/kotlin/com/tuytam/github_downloader/MainActivity.kt
          cp android_custom/PersistentEngine.kt android/app/src/main/kotlin/com/tuytam/github_downloader/PersistentEngine.kt

      - name: Thêm CallbackActivity cho OAuth vào AndroidManifest.xml
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          activity_xml = '''        <activity android:name="com.linusu.flutter_web_auth_2.CallbackActivity" android:exported="true" android:taskAffinity="">
                  <intent-filter android:label="flutter_web_auth_2">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="githubdownloader" />
                  </intent-filter>
              </activity>
          '''

          content = content.replace("</application>", activity_xml + "    </application>")

          # Thêm quyền INTERNET (Flutter mặc định chỉ thêm cho bản debug, release cần khai báo tay)
          if 'android.permission.INTERNET' not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )

          # Thêm quyền ghi file cho Android cũ (dưới Android 10) - từ Android 10 trở lên
          # MediaStore.Downloads không cần quyền đặc biệt nào cả.
          if 'WRITE_EXTERNAL_STORAGE' not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application',
                  1,
              )

          # Thêm quyền cho tính năng khoá vân tay/khuôn mặt (local_auth)
          if 'USE_BIOMETRIC' not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application',
                  1,
              )

          # Thêm quyền + service cho foreground service (giữ app không bị hệ thống giết
          # tiến trình khi người dùng thoát/ẩn app lúc đang tải file) - dùng bởi
          # flutter_foreground_task, xem lib/services/keep_alive_service.dart
          if 'name="android.permission.FOREGROUND_SERVICE"' not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <application',
                  1,
              )
          if 'FOREGROUND_SERVICE_DATA_SYNC' not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <application',
                  1,
              )
          if 'POST_NOTIFICATIONS' not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application',
                  1,
              )
          if 'pravera.flutter_foreground_task.service.ForegroundService' not in content:
              service_xml = '''        <service
                  android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
                  android:foregroundServiceType="dataSync"
                  android:exported="false" />
          '''
              content = content.replace("</application>", service_xml + "    </application>")

          # Thêm taskAffinity="" cho MainActivity để tránh lỗi quay vòng khi redirect từ trình duyệt
          if 'android:name=".MainActivity"' in content and 'taskAffinity' not in content.split('android:name=".MainActivity"')[1].split('>')[0]:
              content = content.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:taskAffinity=""',
              )

          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: (Debug) In cấu hình Kotlin/AGP hiện tại
        run: |
          echo "== android/settings.gradle.kts =="; cat android/settings.gradle.kts 2>/dev/null || echo "(không tồn tại)"
          echo; echo "== android/settings.gradle =="; cat android/settings.gradle 2>/dev/null || echo "(không tồn tại)"
          echo; echo "== android/gradle/libs.versions.toml =="; cat android/gradle/libs.versions.toml 2>/dev/null || echo "(không tồn tại)"

      - name: Cập nhật phiên bản Kotlin (đảm bảo đạt mức tối thiểu Flutter yêu cầu)
        run: |
          # Flutter mới yêu cầu Kotlin Gradle Plugin >= 2.2.20 (xem lỗi:
          # "Your project's Kotlin version (2.2.10) is lower than Flutter's
          # minimum supported version of 2.2.20"). Trước đây bước này set CỨNG
          # xuống 1.9.24 (để né lỗi ngược lại của các bản Flutter cũ hơn), nhưng
          # giờ làm vậy sẽ khiến bản build càng thấp hơn mức tối thiểu và luôn fail.
          # Nay đổi thành: nâng lên >= mức tối thiểu, đồng thời hỗ trợ cả 3 nơi mà
          # bản Kotlin có thể được khai báo (project template của flutter create
          # có thể thay đổi cách khai báo giữa các phiên bản Flutter).
          KOTLIN_MIN="2.2.20"
          updated=0

          # 1) Gradle version catalog - định dạng mới, nhiều khả năng flutter create
          #    bản hiện tại dùng cách này (id(...) trong settings.gradle.kts chỉ còn
          #    "alias(libs.plugins.kotlin.android)", bản Kotlin thật nằm ở đây)
          if [ -f android/gradle/libs.versions.toml ] && grep -qE '^[[:space:]]*kotlin[[:space:]]*=' android/gradle/libs.versions.toml; then
            sed -i -E "s/^([[:space:]]*kotlin[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"$KOTLIN_MIN\"/" android/gradle/libs.versions.toml
            updated=1
            echo "Đã cập nhật Kotlin trong android/gradle/libs.versions.toml -> $KOTLIN_MIN"
          fi

          # 2) settings.gradle.kts - khai báo trực tiếp kiểu Kotlin DSL (định dạng cũ hơn)
          if [ -f android/settings.gradle.kts ] && grep -qE 'id\("org\.jetbrains\.kotlin\.android"\)[[:space:]]*version' android/settings.gradle.kts; then
            sed -i -E "s/(id\(\"org\.jetbrains\.kotlin\.android\"\)[[:space:]]*version[[:space:]]*)\"[^\"]*\"/\1\"$KOTLIN_MIN\"/" android/settings.gradle.kts
            updated=1
            echo "Đã cập nhật Kotlin trong android/settings.gradle.kts -> $KOTLIN_MIN"
          fi

          # 3) settings.gradle - khai báo trực tiếp kiểu Groovy DSL (định dạng cũ)
          if [ -f android/settings.gradle ] && grep -qE 'id "org\.jetbrains\.kotlin\.android"[[:space:]]*version' android/settings.gradle; then
            sed -i -E "s/(id \"org\.jetbrains\.kotlin\.android\"[[:space:]]*version[[:space:]]*)\"[^\"]*\"/\1\"$KOTLIN_MIN\"/" android/settings.gradle
            updated=1
            echo "Đã cập nhật Kotlin trong android/settings.gradle -> $KOTLIN_MIN"
          fi

          if [ "$updated" -eq 0 ]; then
            echo "::warning::Không tìm thấy khai báo phiên bản Kotlin ở libs.versions.toml, settings.gradle hay settings.gradle.kts để cập nhật lên $KOTLIN_MIN. Template của flutter create có thể đã đổi định dạng - cần kiểm tra lại bước này."
          fi

      - name: Cài dependencies
        run: flutter pub get

      - name: Tạo icon app từ ảnh gốc
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: github-downloader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
