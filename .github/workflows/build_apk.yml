name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Tạo scaffold Android (nếu chưa có sẵn trong repo)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.tuytam --project-name github_downloader /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Cấu hình custom URL scheme cho OAuth callback
        run: |
          sed -i '/defaultConfig {/a \        manifestPlaceholders += [callbackScheme: "githubdownloader"]' android/app/build.gradle

      - name: Cài dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: github-downloader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
