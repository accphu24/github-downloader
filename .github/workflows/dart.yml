# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Đây là project Flutter (pubspec.yaml khai báo "flutter: sdk: flutter"),
      # nên phải cài Flutter SDK - dart-lang/setup-dart chỉ cài Dart SDK trần,
      # không có gói "flutter", nên bước "dart pub get" phía dưới trước đây
      # báo lỗi "depends on flutter from sdk which doesn't exist".
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze

      # Repo hiện chưa có thư mục test/ (chưa có file test nào) nên tạm comment
      # bước này để tránh CI báo đỏ không cần thiết - bật lại khi đã viết test.
      # - name: Run tests
      #   run: flutter test
